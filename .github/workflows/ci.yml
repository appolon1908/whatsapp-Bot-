name: Commerce checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: commerce_ci_admin
          # Unique disposable bootstrap value, rotated to random credentials before tests.
          POSTGRES_PASSWORD: disposable-ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: postgres
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
        ports:
          - "127.0.0.1:55483:5432"
        options: >-
          --health-cmd "pg_isready -U commerce_ci_admin -d postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.4"
          enable-cache: true
      - name: Install PostgreSQL 16 backup clients
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
      - name: Configure disposable test database authentication
        env:
          PG_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
          PGPASSWORD: disposable-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/ci-configure-postgres.sh
      - name: Install locked development dependencies
        run: uv sync --frozen --extra dev
      - name: Lint and formatting
        run: |
          uv run --frozen --extra dev ruff check .
          uv run --frozen --extra dev ruff format --check .
      - name: Full PostgreSQL and application test suite
        run: uv run --frozen --extra dev pytest
      - name: Build distributable wheel
        run: uv build --wheel
      - name: Audit installed dependencies
        run: |
          uv export --frozen --extra dev --no-emit-project --format requirements-txt --output-file "${RUNNER_TEMP}/commerce-audit-requirements.txt"
          uv run --frozen --extra dev pip-audit --disable-pip --no-deps -r "${RUNNER_TEMP}/commerce-audit-requirements.txt"
      - name: Build nonroot runtime image
        run: docker build --tag codestra-whatsapp-commerce:ci .
      - name: Verify isolated container startup and safe readiness
        run: |
          set -euo pipefail
          docker run --detach --name commerce-smoke --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --publish 127.0.0.1:18783:8783 codestra-whatsapp-commerce:ci
          trap 'docker rm --force commerce-smoke >/dev/null' EXIT
          healthy=false
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:18783/healthz >/dev/null; then
              healthy=true
              break
            fi
            sleep 1
          done
          "$healthy"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18783/readyz)" = 503
          docker exec commerce-smoke python -c 'import os; from importlib.resources import files; assert os.getuid() == os.getgid() == 10001; assert files("whatsapp_bot").joinpath("migrations/versions/0001_schema.sql").is_file()'
